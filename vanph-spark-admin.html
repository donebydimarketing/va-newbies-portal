<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spark Admin — VA Newbies PH</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --white: #fafafa;
    --mid: #767676;
    --border: #d6d6d2;
    --green: #2f6b3f;
    --red: #a12a2a;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
    line-height: 1.5;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  #js-status {
    position: fixed;
    bottom: 12px;
    right: 12px;
    font-size: 11px;
    color: var(--mid);
    font-family: monospace;
    z-index: 999;
  }

  #screen-login.active {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-box { width: 100%; max-width: 360px; }
  .login-box .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }
  .login-box .sub {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 32px;
  }
  .login-box label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 8px;
  }
  .login-box input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .login-box input:focus { outline: none; border-color: var(--black); }
  .login-error {
    display: none;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
  }
  .login-error.show { display: block; }
  .btn-main {
    width: 100%;
    padding: 14px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1.5px solid var(--black);
    background: var(--black);
    color: var(--white);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-main:hover { opacity: 0.85; }

  header {
    border-bottom: 2px solid var(--black);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 18px; }
  header .brand span { color: var(--mid); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .logout-link {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mid);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }
  .logout-link:hover { color: var(--black); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 100px; }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 2px solid var(--black);
    margin-bottom: 40px;
  }
  .stat-cell { padding: 24px; text-align: center; }
  .stat-cell:first-child { border-right: 1.5px solid var(--black); }
  .stat-cell .n { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 36px; }
  .stat-cell .l { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid); margin-top: 4px; }

  .tabs { display: flex; border-bottom: 2px solid var(--black); margin-bottom: 28px; }
  .tab {
    padding: 12px 20px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    color: var(--mid);
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: var(--black); border-bottom-color: var(--black); }

  .card { border: 1.5px solid var(--border); padding: 22px; margin-bottom: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .card-name { font-size: 17px; font-weight: 700; }
  .card-email { font-size: 13px; color: var(--mid); margin-top: 2px; }
  .status-pill {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1.5px solid var(--black);
    white-space: nowrap;
  }
  .status-pill.approved { border-color: var(--green); color: var(--green); }
  .status-pill.pending { border-color: var(--black); color: var(--black); }

  .card-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
    margin-bottom: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .card-detail { font-size: 13px; }
  .card-detail .k { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); margin-bottom: 3px; }
  .card-detail .v { word-break: break-all; }
  .card-detail a { color: var(--black); }

  .card-actions { display: flex; gap: 10px; }
  .reviewer-row { margin-bottom: 14px; }
  .reviewer-row label { display: block; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); margin-bottom: 6px; }
  .reviewer-row input {
    width: 100%;
    max-width: 240px;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }
  .reviewer-row input:focus { outline: none; border-color: var(--black); }
  .btn-sm {
    padding: 10px 20px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1.5px solid var(--black);
    background: var(--white);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-sm.approve { background: var(--black); color: var(--white); }
  .btn-sm.approve:hover { opacity: 0.85; }
  .btn-sm.reject { border-color: var(--red); color: var(--red); }
  .btn-sm.reject:hover { background: var(--red); color: var(--white); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--mid);
    font-size: 14px;
    border: 1.5px dashed var(--border);
  }

  @media (max-width: 560px) {
    header { padding: 16px 20px; }
    .wrap { padding: 28px 16px 80px; }
    .card-detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="js-status">loading...</div>

<div class="screen active" id="screen-login">
  <div class="login-box">
    <div class="brand">VA Newbies PH</div>
    <div class="sub">Spark Admin</div>
    <div class="login-error" id="login-error">Incorrect password.</div>
    <form id="login-form">
      <label for="admin-pass">Admin Password</label>
      <input type="password" id="admin-pass" autocomplete="off" />
      <button type="submit" class="btn-main" id="login-btn">Log In</button>
    </form>
  </div>
</div>

<div class="screen" id="screen-dashboard">
  <header>
    <div class="brand">VA Newbies PH <span>Spark Admin</span></div>
    <button class="logout-link" id="logout-btn">Log Out</button>
  </header>

  <div class="wrap">
    <div class="stat-row">
      <div class="stat-cell">
        <div class="n" id="stat-pending">—</div>
        <div class="l">Pending Review</div>
      </div>
      <div class="stat-cell">
        <div class="n" id="stat-approved">—</div>
        <div class="l">Approved</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-pending" data-tab="pending">Pending</button>
      <button class="tab" id="tab-approved" data-tab="approved">Approved</button>
    </div>

    <div id="list-container"></div>
  </div>
</div>

<script>
  // ===== No external libraries loaded at all. =====
  // The previous version loaded the Supabase JS SDK from a CDN, and that
  // SDK uses eval() internally. If a site has a Content Security Policy
  // that blocks eval() (common on GitHub Pages orgs with security add-ons,
  // or certain browser/network security software), loading that SDK
  // throws a fatal script error, which can silently stop everything below
  // it from running, including the login button's wiring. That was the
  // real bug behind every "the button does nothing" report.
  //
  // This version talks to Supabase directly via fetch() and its REST API,
  // which is a plain built-in browser feature, no SDK, no eval, nothing
  // that a CSP eval block can trip.

  var statusEl = document.getElementById('js-status');
  statusEl.textContent = 'script running...';

  var ADMIN_PASSWORD = 'vanph2026admin';
  var SUPABASE_URL = 'https://mbcwgtrliiocqcgwbfnu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1iY3dndHJsaWlvY3FjZ3diZm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwMzMsImV4cCI6MjA5MTUyMDAzM30.bs3bm6PEK82hr2T9NPs6lQ6jlgolL6wE-TDblXDEMVE';

  var currentTab = 'pending';
  var allRows = [];

  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    document.getElementById('screen-' + name).classList.add('active');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str == null ? '' : str).replace(/"/g, '&quot;');
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    var pass = document.getElementById('admin-pass').value.trim();
    var errEl = document.getElementById('login-error');
    errEl.classList.remove('show');
    if (pass !== ADMIN_PASSWORD) {
      errEl.classList.add('show');
      return false;
    }
    showScreen('dashboard');
    loadData();
    return false;
  }

  function handleLogout() {
    document.getElementById('admin-pass').value = '';
    showScreen('login');
  }

  function handleTabClick(e) {
    var name = e.currentTarget.getAttribute('data-tab');
    currentTab = name;
    document.getElementById('tab-pending').classList.toggle('active', name === 'pending');
    document.getElementById('tab-approved').classList.toggle('active', name === 'approved');
    renderList();
  }

  // ---- REST helpers (replace the old Supabase SDK calls) ----
  function restHeaders(extra) {
    var h = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    };
    if (extra) { for (var k in extra) h[k] = extra[k]; }
    return h;
  }

  function fetchEnrollments() {
    var url = SUPABASE_URL + '/rest/v1/spark_enrollments?select=*&order=created_at.desc';
    return fetch(url, { headers: restHeaders() }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error('Server returned ' + res.status + '. ' + t);
        });
      }
      return res.json();
    });
  }

  function updateEnrollment(id, body) {
    var url = SUPABASE_URL + '/rest/v1/spark_enrollments?id=eq.' + encodeURIComponent(id);
    return fetch(url, {
      method: 'PATCH',
      headers: restHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error('Server returned ' + res.status + '. ' + t);
        });
      }
    });
  }

  function deleteEnrollment(id) {
    var url = SUPABASE_URL + '/rest/v1/spark_enrollments?id=eq.' + encodeURIComponent(id);
    return fetch(url, {
      method: 'DELETE',
      headers: restHeaders()
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error('Server returned ' + res.status + '. ' + t);
        });
      }
    });
  }

  function loadData() {
    var container = document.getElementById('list-container');
    container.innerHTML = '<div class="empty-state">Loading...</div>';

    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      container.innerHTML = '<div class="empty-state">Request timed out. Check your internet connection and try again.</div>';
    }, 10000);

    fetchEnrollments()
      .then(function (data) {
        if (timedOut) return;
        clearTimeout(timer);
        allRows = data || [];
        var pendingCount = 0, approvedCount = 0;
        for (var i = 0; i < allRows.length; i++) {
          if (allRows[i].status === 'pending_review') pendingCount++;
          if (allRows[i].status === 'approved') approvedCount++;
        }
        document.getElementById('stat-pending').textContent = pendingCount;
        document.getElementById('stat-approved').textContent = approvedCount;
        renderList();
      })
      .catch(function (err) {
        if (timedOut) return;
        clearTimeout(timer);
        container.innerHTML = '<div class="empty-state">Could not load enrollments. ' + escapeHtml(err.message || 'Something went wrong.') + '</div>';
      });
  }

  function renderList() {
    var container = document.getElementById('list-container');
    var targetStatus = currentTab === 'pending' ? 'pending_review' : 'approved';
    var rows = [];
    for (var i = 0; i < allRows.length; i++) {
      if (allRows[i].status === targetStatus) rows.push(allRows[i]);
    }

    if (rows.length === 0) {
      container.innerHTML = '<div class="empty-state">No ' + (currentTab === 'pending' ? 'pending' : 'approved') + ' enrollments.</div>';
      return;
    }

    var html = '';
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      html += '<div class="card">';
      html += '<div class="card-top"><div>';
      html += '<div class="card-name">' + escapeHtml(r.full_name || 'Unknown') + '</div>';
      html += '<div class="card-email">' + escapeHtml(r.email || '') + '</div>';
      html += '</div><span class="status-pill ' + (r.status === 'approved' ? 'approved' : 'pending') + '">' + (r.status === 'approved' ? 'Approved' : 'Pending Review') + '</span></div>';

      html += '<div class="card-detail-grid">';
      html += '<div class="card-detail"><div class="k">Facebook Profile</div><div class="v">' + (r.fb_link ? '<a href="' + escapeAttr(r.fb_link) + '" target="_blank" rel="noopener">' + escapeHtml(r.fb_link) + '</a>' : '—') + '</div></div>';
      html += '<div class="card-detail"><div class="k">GCash Reference</div><div class="v">' + escapeHtml(r.gcash_ref || '—') + '</div></div>';
      html += '<div class="card-detail"><div class="k">Receipt Screenshot</div><div class="v">' + (r.receipt_link ? '<a href="' + escapeAttr(r.receipt_link) + '" target="_blank" rel="noopener">View Screenshot</a>' : '—') + '</div></div>';
      html += '<div class="card-detail"><div class="k">Submitted</div><div class="v">' + (r.created_at ? new Date(r.created_at).toLocaleString('en-PH') : '—') + '</div></div>';
      if (currentTab === 'approved') {
        html += '<div class="card-detail"><div class="k">Reviewed By</div><div class="v">' + escapeHtml(r.reviewed_by || '—') + '</div></div>';
      }
      html += '</div>';

      if (currentTab === 'pending') {
        html += '<div class="reviewer-row"><label for="reviewer-' + escapeAttr(r.id) + '">Reviewed By</label>';
        html += '<input type="text" id="reviewer-' + escapeAttr(r.id) + '" placeholder="Your name" /></div>';
        html += '<div class="card-actions">';
        html += '<button class="btn-sm approve" data-approve-id="' + escapeAttr(r.id) + '">Approve</button>';
        html += '<button class="btn-sm reject" data-reject-id="' + escapeAttr(r.id) + '">Reject</button>';
        html += '</div>';
      }
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function approveRow(id) {
    var reviewerInput = document.getElementById('reviewer-' + id);
    var reviewer = reviewerInput ? reviewerInput.value.trim() : '';
    if (!reviewer) {
      alert('Enter your name in Reviewed By before approving.');
      return;
    }
    updateEnrollment(id, { status: 'approved', reviewed_by: reviewer })
      .then(function () { loadData(); })
      .catch(function (err) { alert('Could not approve: ' + err.message); });
  }

  function rejectRow(id) {
    var row = null;
    for (var i = 0; i < allRows.length; i++) { if (allRows[i].id === id) { row = allRows[i]; break; } }
    var reviewerInput = document.getElementById('reviewer-' + id);
    var reviewer = reviewerInput ? reviewerInput.value.trim() : '';
    if (!reviewer) {
      alert('Enter your name in Reviewed By before rejecting.');
      return;
    }
    var confirmed = confirm('Reject and remove ' + (row && row.full_name ? row.full_name : 'this enrollment') + '? This deletes their enrollment record permanently.');
    if (!confirmed) return;
    deleteEnrollment(id)
      .then(function () { loadData(); })
      .catch(function (err) { alert('Could not reject: ' + err.message); });
  }

  // Wire everything up immediately. This script tag is at the bottom of
  // the page, so the DOM already exists by the time this line runs.
  document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
  document.getElementById('logout-btn').addEventListener('click', handleLogout);
  document.getElementById('tab-pending').addEventListener('click', handleTabClick);
  document.getElementById('tab-approved').addEventListener('click', handleTabClick);
  document.getElementById('list-container').addEventListener('click', function (e) {
    var approveBtn = e.target.closest('[data-approve-id]');
    if (approveBtn) { approveRow(approveBtn.getAttribute('data-approve-id')); return; }
    var rejectBtn = e.target.closest('[data-reject-id]');
    if (rejectBtn) { rejectRow(rejectBtn.getAttribute('data-reject-id')); }
  });

  statusEl.textContent = 'ready';
</script>

</body>
</html>
