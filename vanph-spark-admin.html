<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spark Admin — VA Newbies PH</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --white: #fafafa;
    --mid: #767676;
    --border: #d6d6d2;
    --panel: #f3f2ee;
    --green: #2f6b3f;
    --red: #a12a2a;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
    line-height: 1.5;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* LOGIN */
  #screen-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-box {
    width: 100%;
    max-width: 360px;
  }
  .login-box .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }
  .login-box .sub {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 32px;
  }
  .login-box label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 8px;
  }
  .login-box input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .login-box input:focus { outline: none; border-color: var(--black); }
  .login-error {
    display: none;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
  }
  .login-error.show { display: block; }

  /* HEADER */
  header {
    border-bottom: 2px solid var(--black);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 18px;
  }
  header .brand span { color: var(--mid); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .logout-link {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mid);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }
  .logout-link:hover { color: var(--black); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 100px; }

  /* STATS */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 2px solid var(--black);
    margin-bottom: 40px;
  }
  .stat-cell {
    padding: 24px;
    text-align: center;
  }
  .stat-cell:first-child { border-right: 1.5px solid var(--black); }
  .stat-cell .n {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 36px;
  }
  .stat-cell .l {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--mid);
    margin-top: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--black);
    margin-bottom: 28px;
  }
  .tab {
    padding: 12px 20px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    color: var(--mid);
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: var(--black); border-bottom-color: var(--black); }

  /* MEMBER CARD */
  .card {
    border: 1.5px solid var(--border);
    padding: 22px;
    margin-bottom: 16px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .card-name { font-size: 17px; font-weight: 700; }
  .card-email { font-size: 13px; color: var(--mid); margin-top: 2px; }
  .status-pill {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1.5px solid var(--black);
    white-space: nowrap;
  }
  .status-pill.approved { border-color: var(--green); color: var(--green); }
  .status-pill.pending { border-color: var(--black); color: var(--black); }

  .card-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
    margin-bottom: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .card-detail {
    font-size: 13px;
  }
  .card-detail .k {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 3px;
  }
  .card-detail .v { word-break: break-all; }
  .card-detail a { color: var(--black); }

  .card-actions { display: flex; gap: 10px; }
  .btn-sm {
    padding: 10px 20px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1.5px solid var(--black);
    background: var(--white);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-sm.approve { background: var(--black); color: var(--white); }
  .btn-sm.approve:hover { opacity: 0.85; }
  .btn-sm.reject { border-color: var(--red); color: var(--red); }
  .btn-sm.reject:hover { background: var(--red); color: var(--white); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--mid);
    font-size: 14px;
    border: 1.5px dashed var(--border);
  }

  @media (max-width: 560px) {
    header { padding: 16px 20px; }
    .wrap { padding: 28px 16px 80px; }
    .card-detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen active" id="screen-login">
  <div class="login-box">
    <div class="brand">VA Newbies PH</div>
    <div class="sub">Spark Admin</div>
    <div class="login-error" id="login-error">Incorrect password.</div>
    <label for="admin-pass">Admin Password</label>
    <input type="password" id="admin-pass" onkeydown="if(event.key==='Enter')adminLogin()" />
    <button class="btn-sm approve" style="width:100%; padding:14px;" onclick="adminLogin()">Log In</button>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div class="screen" id="screen-dashboard">
  <header>
    <div class="brand">VA Newbies PH <span>Spark Admin</span></div>
    <button class="logout-link" onclick="adminLogout()">Log Out</button>
  </header>

  <div class="wrap">
    <div class="stat-row">
      <div class="stat-cell">
        <div class="n" id="stat-pending">—</div>
        <div class="l">Pending Review</div>
      </div>
      <div class="stat-cell">
        <div class="n" id="stat-approved">—</div>
        <div class="l">Approved</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-pending" onclick="switchTab('pending')">Pending</button>
      <button class="tab" id="tab-approved" onclick="switchTab('approved')">Approved</button>
    </div>

    <div id="list-container"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mbcwgtrliiocqcgwbfnu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1iY3dndHJsaWlvY3FjZ3diZm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwMzMsImV4cCI6MjA5MTUyMDAzM30.bs3bm6PEK82hr2T9NPs6lQ6jlgolL6wE-TDblXDEMVE';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ADMIN_PASSWORD = 'vanph2026admin'; // Change this to your own password anytime

  let currentTab = 'pending';
  let allRows = [];

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  function adminLogin() {
    const pass = document.getElementById('admin-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('show');

    if (pass !== ADMIN_PASSWORD) {
      errEl.classList.add('show');
      return;
    }
    showScreen('dashboard');
    loadData();
  }

  function adminLogout() {
    document.getElementById('admin-pass').value = '';
    showScreen('login');
  }

  async function loadData() {
    const { data, error } = await sb
      .from('spark_enrollments')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('list-container').innerHTML =
        '<div class="empty-state">Could not load enrollments. ' + error.message + '</div>';
      return;
    }

    allRows = data || [];
    const pendingCount = allRows.filter(r => r.status === 'pending_review').length;
    const approvedCount = allRows.filter(r => r.status === 'approved').length;
    document.getElementById('stat-pending').textContent = pendingCount;
    document.getElementById('stat-approved').textContent = approvedCount;

    renderList();
  }

  function switchTab(name) {
    currentTab = name;
    document.getElementById('tab-pending').classList.toggle('active', name === 'pending');
    document.getElementById('tab-approved').classList.toggle('active', name === 'approved');
    renderList();
  }

  function renderList() {
    const container = document.getElementById('list-container');
    const targetStatus = currentTab === 'pending' ? 'pending_review' : 'approved';
    const rows = allRows.filter(r => r.status === targetStatus);

    if (rows.length === 0) {
      container.innerHTML = '<div class="empty-state">No ' + (currentTab === 'pending' ? 'pending' : 'approved') + ' enrollments.</div>';
      return;
    }

    container.innerHTML = rows.map(r => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHtml(r.full_name || 'Unknown')}</div>
            <div class="card-email">${escapeHtml(r.email || '')}</div>
          </div>
          <span class="status-pill ${r.status === 'approved' ? 'approved' : 'pending'}">${r.status === 'approved' ? 'Approved' : 'Pending Review'}</span>
        </div>
        <div class="card-detail-grid">
          <div class="card-detail">
            <div class="k">Facebook Profile</div>
            <div class="v">${r.fb_link ? '<a href="' + escapeAttr(r.fb_link) + '" target="_blank" rel="noopener">' + escapeHtml(r.fb_link) + '</a>' : '—'}</div>
          </div>
          <div class="card-detail">
            <div class="k">GCash Reference</div>
            <div class="v">${escapeHtml(r.gcash_ref || '—')}</div>
          </div>
          <div class="card-detail">
            <div class="k">Receipt Screenshot</div>
            <div class="v">${r.receipt_link ? '<a href="' + escapeAttr(r.receipt_link) + '" target="_blank" rel="noopener">View Screenshot</a>' : '—'}</div>
          </div>
          <div class="card-detail">
            <div class="k">Submitted</div>
            <div class="v">${r.created_at ? new Date(r.created_at).toLocaleString('en-PH') : '—'}</div>
          </div>
        </div>
        ${currentTab === 'pending' ? `
        <div class="card-actions">
          <button class="btn-sm approve" onclick="approveRow('${r.id}')">Approve</button>
          <button class="btn-sm reject" onclick="rejectRow('${r.id}')">Reject</button>
        </div>` : ''}
      </div>
    `).join('');
  }

  async function approveRow(id) {
    const { error } = await sb
      .from('spark_enrollments')
      .update({ status: 'approved' })
      .eq('id', id);
    if (error) { alert('Could not approve: ' + error.message); return; }
    await loadData();
  }

  async function rejectRow(id) {
    const row = allRows.find(r => r.id === id);
    const confirmed = confirm('Reject and remove ' + (row?.full_name || 'this enrollment') + '? This deletes their enrollment record permanently.');
    if (!confirmed) return;
    const { error } = await sb
      .from('spark_enrollments')
      .delete()
      .eq('id', id);
    if (error) { alert('Could not reject: ' + error.message); return; }
    await loadData();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

</script>

</body>
</html>
